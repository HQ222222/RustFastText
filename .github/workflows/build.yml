name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: rustfasttext

jobs:
  # aarch64-unknown-linux-gnu：在 GitHub 官方 ARM64 runner 上原生编译，
  # 无需 Docker / 交叉工具链，产物为真正的 aarch64 ELF，可直接拷贝到 ARM 服务器运行。
  build-aarch64:
    name: aarch64-unknown-linux-gnu
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: 缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      - name: 编译
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: 校验产物格式
        run: |
          uname -m
          file "target/aarch64-unknown-linux-gnu/release/$BIN_NAME"
          file "target/aarch64-unknown-linux-gnu/release/$BIN_NAME" | grep -q aarch64

      - name: smoke-1-version
        run: target/aarch64-unknown-linux-gnu/release/$BIN_NAME --version

      - name: smoke-2-train
        run: target/aarch64-unknown-linux-gnu/release/$BIN_NAME train --input data/train.txt --output /tmp/model.bin --epoch 20 --threads 2

      - name: smoke-3-info
        run: target/aarch64-unknown-linux-gnu/release/$BIN_NAME info --model /tmp/model.bin

      - name: smoke-4-predict-text
        run: |
          target/aarch64-unknown-linux-gnu/release/$BIN_NAME predict --model /tmp/model.bin --text "mysql connection pool is exhausted" -k 2 | tee /tmp/pred.txt
          grep -q '__label__' /tmp/pred.txt

      - name: smoke-5-predict-file
        run: target/aarch64-unknown-linux-gnu/release/$BIN_NAME predict --model /tmp/model.bin --input data/test.txt -k 1

      - name: smoke-6-analyze
        run: target/aarch64-unknown-linux-gnu/release/$BIN_NAME analyze --model /tmp/model.bin --text "the raid controller beeps and the disk is gone" --json

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rustfasttext-aarch64-unknown-linux-gnu
          path: target/aarch64-unknown-linux-gnu/release/${{ env.BIN_NAME }}
          if-no-files-found: error

  # Windows x86_64（x64）原生编译，windows-latest 默认工具链即 x86_64-pc-windows-msvc
  build-windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: 编译
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: smoke-1-version
        shell: bash
        run: target/x86_64-pc-windows-msvc/release/$BIN_NAME.exe --version

      - name: smoke-2-train
        shell: bash
        run: target/x86_64-pc-windows-msvc/release/$BIN_NAME.exe train --input data/train.txt --output model-ci.bin --epoch 20 --threads 2

      - name: smoke-3-predict
        shell: bash
        run: |
          target/x86_64-pc-windows-msvc/release/$BIN_NAME.exe predict --model model-ci.bin --text "mysql connection pool is exhausted" -k 2 | tee pred.txt
          grep -q '__label__' pred.txt

      - name: smoke-4-info
        shell: bash
        run: target/x86_64-pc-windows-msvc/release/$BIN_NAME.exe info --model model-ci.bin

      - name: smoke-5-analyze
        shell: bash
        run: target/x86_64-pc-windows-msvc/release/$BIN_NAME.exe analyze --model model-ci.bin --text "the raid controller beeps and the disk is gone" --json

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rustfasttext-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/${{ env.BIN_NAME }}.exe
          if-no-files-found: error

  release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-aarch64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 查看产物
        run: ls -lh artifacts

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
